# Arrowix OS - GRUB 2 configuration (Multiboot2 boot entry).

set timeout=3
set default=0

menuentry "Arrowix OS" {
    # Request a linear framebuffer; the kernel reads the framebuffer tag.
    insmod all_video
    multiboot2 /boot/arrowix.elf
    boot
}

menuentry "Arrowix OS (text mode)" {
    multiboot2 /boot/arrowix.elf text
    boot
}
